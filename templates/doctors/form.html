{% extends "base.html" %}

{% block content %}
<div style="margin-bottom: 2rem;">
    <h1>Edit Doctor</h1>
    <p style="color: var(--text-light);">Update details for {{ doctor.name }}.</p>
</div>

<div class="card" style="max-width: 600px;">
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Doctor Name</label>
            <input type="text" name="name" class="form-control" value="{{ doctor.name }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Share Percentage (%)</label>
            <input type="number" step="0.01" name="share_percentage" class="form-control" value="{{ doctor.share_percentage }}" required>
        </div>
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary">Update Doctor</button>
            <a href="{{ url_for('doctor_list') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
